name = "riff-worker-inventory"
description = "Inventory worker runtime adapter."
semantic_role = "worker"
route_class = "inventory"
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
service_tier = "priority"
sandbox_mode = "workspace-write"
role_spec_path = "agents/roles/worker.md"
developer_instructions = """
Require role_spec_path in the dispatch context.
Stop if role_spec_path is missing or is not an absolute filesystem path.
Load the canonical specification at role_spec_path before acting.
Apply only the supplied assignment and return summary content.
"""

[features]
multi_agent = false
