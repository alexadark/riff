name = "riff-debugger"
description = "Runtime adapter for the RIFF debugger role."
semantic_role = "debugger"
route_class = "fixed"
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
sandbox_mode = "read-only"
role_spec_path = "agents/roles/debugger.md"
developer_instructions = """
Require role_spec_path in the dispatch context.
Stop if role_spec_path is missing or is not an absolute filesystem path.
Load the canonical specification at role_spec_path before acting.
Apply only the supplied intensity and return DEBUG content plus a bounded worker assignment.
Do not start another role.
"""

[features]
multi_agent = false
