name: Framework Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: framework-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.144.1

      - name: Verify Codex CLI
        run: codex --version

      - name: RIFF Doctor
        run: node scripts/riff-doctor.mjs --ci

      - name: RIFF Init installer
        run: bash scripts/__tests__/riff-init.sh

      - name: RIFF Resync installer
        run: bash scripts/__tests__/riff-resync.sh

      - run: npx vitest run
