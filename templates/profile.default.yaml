# profile.default.yaml — canonical "no preferences set" baseline
#
# This is the tier-3 fallback in the profile resolution chain:
#   1. <project_root>/.planning/profile.yaml   — per-project override
#   2. <framework_root>/profile.yaml            — global default
#   3. <framework_root>/templates/profile.default.yaml  — this file
#
# Mirrors the default profile documented in commands/onboard.md § Default profile.
# Edit that map there first, then sync this file. Resolvers
# (lib/resolve-profile.sh, dashboard/lib/resolveProfile.ts) load this
# verbatim when neither user profile exists.

runtime:
  # Native stage provider. Both adapters are installed so this can be changed
  # per project without reinstalling RIFF.
  provider: codex

user:
  programming_level: intermediate
  ai_agents_experience: tried
  domains: [generalist]
  work_mode: solo
  side_activities: [none]
  conversational_language: en
  artifact_language: en
  narrative_language: en

executors:
  available: [claude, codex]

codex:
  execution_skill: /apex  # skill invoked by CODEX-DELEGATION.md prompt templates; must accept -a -x -v -m -bundle <path>

models:
  # Inline frontier role: orchestration, planner, and the debugger default.
  # Single knob for the strong reasoning model. Change this one line when the
  # flagship rotates (e.g. Fable retired). Sub-agents read it at the call site;
  # the parent-session force in command frontmatter is a static mirror of it.
  reasoning: opus

debugger:
  # Debugger dispatch tier when no --tier flag and no auto-mapping signal
  # matches. normal = models.reasoning at effort high (pre-tier behavior),
  # high = fable/high, max = fable/max. Max is a viciousness signal (flaky,
  # can't-reproduce, races, repeated failed fixes), not a severity signal.
  # See agents/debugger.md § Tiers.
  default_tier: normal
  delegation:
    # Model the debugger spawns to APPLY each fix (edit + typecheck + biome +
    # tests + atomic commit) after diagnosing at its own tier. sonnet | opus | fable.
    mechanical_worker: sonnet

risk:
  sensitive_task_preference: balanced

style:
  length: standard
  allow_jargon: first_mention
  when_uncertain: important_only
  explanation_level: simple

budget:
  default_quality: balanced

notifications:
  channel: none

metadata:
  # PR body metadata detail: off | standard | full.
  # standard excludes token tables and captured prompts; full includes them.
  pr_body: standard

wave:
  # Maximum independent task workers dispatched concurrently inside one
  # validated PLAN wave. Set to 1 to force sequential execution.
  parallel_workers: 4
  # Reconcile pass run by /riff:wave --resume Step 6.
  # Valid: hooks | sonnet | both | off. See protocols/WAVE-RECONCILE.md § Modes.
  reconcile_mode: both
  # Wave executor: sonnet (parallel Claude sub-agent workers, default) | codex
  # (opt-in delegation to the Codex CLI for volume work).
  # Override per wave with /riff:wave --executor. See commands/wave.md § Step 5c.
  executor: sonnet
  # Codex sub-mode (mode C, default). codex-exec-in-session: the RIFF session runs
  # `codex exec` headless in the background and auto-reconciles on exit — no manual
  # paste, interrupt only on FAIL/HITL. Set run_mode to `paste` for the legacy flow.
  codex_exec:
    run_mode: codex-exec-in-session
    sandbox_bypass: true
    background: true
    auto_reconcile: true
    reasoning_effort: high
    reasoning_effort_security_critical: xhigh
    fallback: paste

git:
  # Valid values: github_button | local_no_ff
  merge_strategy: github_button

autonomy:
  # Skip the single launch-confirmation prompt on `--autonomous` runs. Default
  # off — approval stays at each launch unless explicitly opted in.
  auto_launch: false
  # park (default): `hold` phases and unfixable failures never merge
  # unattended, wait for a human decision (finisher). flag_and_continue: for
  # operators who don't evaluate security/compliance themselves — see
  # protocols/AUTONOMY.md § Autonomy boundary before switching this.
  hold_behavior: park
  # Diagnose->fix->re-verify cycles before giving up, only under
  # flag_and_continue. See protocols/AUTONOMY.md § Merge policy.
  debug_cycle_cap: 3

dashboard:
  projects: []
