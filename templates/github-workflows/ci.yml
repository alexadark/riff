name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

# RIFF default template: typecheck + tests + build gate merges.
# Lint, format, dependency audit, Semgrep, and Gitleaks are project opt-ins.
# Swap `npm` → `pnpm` and `actions/setup-node` → `pnpm/action-setup` if the project uses pnpm.

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # If vitest.config.ts defines multiple projects (e.g. unit + storybook),
      # run only the jsdom-based ones here. Browser-mode projects (Storybook
      # stories, Playwright component tests) need browsers installed and belong
      # in the E2E workflow. Adjust `--project=unit` to match your project name.
      - name: Unit Tests
        run: npm run test -- --project=unit --coverage

      - name: Build
        run: npm run build
