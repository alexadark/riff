name: Framework Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: framework-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: RIFF Doctor
        run: node scripts/riff-doctor.mjs --ci

      - run: npx vitest run
